name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['docs/**']
  workflow_dispatch:

# Allow one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # Enables the Pages site on first run (default is false, which fails
          # with 'Get Pages site failed' on repos that have never had Pages on)
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          # The privacy policy (and any other static docs) live in /docs
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
