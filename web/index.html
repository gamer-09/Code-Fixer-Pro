<!DOCTYPE html>
<html lang="en" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <style>
      html { color-scheme: dark; }
      html, body, * { scrollbar-width: none; -ms-overflow-style: none; }
      *::-webkit-scrollbar, *::-webkit-scrollbar-button { display: none !important; width: 0 !important; height: 0 !important; }
    </style>
    <link rel="icon" type="image/svg+xml" href="/Code-Fixer-Pro/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080B10" />
    <meta name="description" content="FloBoard — live markets, crypto, forex, news, and AI analysis. Tracking only — no deposits, no bank logins." />
    <title>FloBoard — Live Markets</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      (function () {
        var repo = '/Code-Fixer-Pro';
        var path = location.pathname;
        if (path.indexOf(repo) === 0) path = path.slice(repo.length);
        if (path && path !== '/' && path !== '/index.html' && !location.hash) {
          location.replace(repo + '/#' + path + location.search);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
