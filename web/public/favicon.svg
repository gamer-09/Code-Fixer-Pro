<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E1219"/>
      <stop offset="100%" stop-color="#080B10"/>
    </linearGradient>
    <linearGradient id="chart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00E5A0"/>
      <stop offset="100%" stop-color="#00B880"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- Chart bars going up -->
  <rect x="5" y="18" width="4" height="9" rx="1.5" fill="#FF4D6A" opacity="0.9"/>
  <rect x="11" y="13" width="4" height="14" rx="1.5" fill="#FFB627" opacity="0.9"/>
  <rect x="17" y="9" width="4" height="18" rx="1.5" fill="#00E5A0" opacity="0.9"/>
  <rect x="23" y="5" width="4" height="22" rx="1.5" fill="url(#chart)"/>
  <!-- Trend line -->
  <polyline points="7,17 13,12 19,8 25,4" fill="none" stroke="#00E5A0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
  <!-- Pulse dot -->
  <circle cx="25" cy="4" r="2" fill="#00E5A0"/>
</svg>
