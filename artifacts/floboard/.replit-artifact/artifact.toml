kind = "mobile"
previewPath = "/"
title = "FloBoard"
version = "1.0.0"
id = "artifacts/floboard"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 20736

[services.development]
run = "pnpm --filter @workspace/floboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/floboard", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/floboard", "run", "serve" ]

[services.env]
PORT = "20736"
BASE_PATH = "/"
